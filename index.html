<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sister Game Night</title>
<style>
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:#fff8ee;color:#2b2118}
  main{max-width:640px;margin:0 auto;padding:48px 20px;text-align:center}
  h1{font-size:2.2rem;margin-bottom:8px}
  p.sub{color:#6b5744;margin-top:0}
  a.game{display:block;margin:28px auto;padding:22px;border:2px solid #e3d5c3;border-radius:14px;background:#fff;text-decoration:none;color:#2b2118;max-width:420px}
  a.game:hover{border-color:#8a4b2a}
  a.game .name{font-size:1.5rem;font-weight:bold}
  a.game .desc{color:#6b5744;margin-top:6px}
  .soon{color:#9a8871;font-style:italic;margin-top:32px}
</style>
</head>
<body>
<main>
  <h1>Sister Game Night</h1>
  <p class="sub">Our games, wherever we all happen to be.</p>

  <a class="game" href="sister-tiles/">
    <div class="name">Sister Tiles</div>
    <div class="desc">Match tiles by color or shape. One sister hosts and shares the room code, everyone else joins from home.</div>
  </a>

  <p class="soon">More games coming soon.</p>
</main>
</body>
</html>
